name: 功能建议                      # 模板名称
description: 提出新功能或改进建议
title: "[Feature] "                 # 标题前缀
labels: [enhancement]               # 自动打标签
body:                               # 表单主体
  - type: input                     # 单行输入框
    id: req                         # 字段 ID
    attributes:
      label: 关联需求编号（可选）   # 字段标签
      placeholder: 如 R7（笔记自动进知识库），无则留空
    validations:
      required: false               # 选填

  - type: textarea                  # 多行文本框
    id: desc                        # 字段 ID
    attributes:
      label: 功能描述               # 字段标签
      placeholder: 希望实现什么功能、解决什么问题
    validations:
      required: true                # 必填

  - type: textarea                  # 多行文本框
    id: why                         # 字段 ID
    attributes:
      label: 使用场景与价值         # 字段标签
      placeholder: 在什么场景下需要它，为什么重要
    validations:
      required: false               # 选填

name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug + lint + unit tests
        run: gradle :app:assembleDebug :app:lintDebug testDebugUnitTest --stacktrace

      - name: Docs presence check (R12)
        run: |
          for f in \
            docs/00-overview.md \
            docs/01-architecture.md \
            docs/03-contracts.md \
            docs/04-database.md \
            docs/05-model-hardware.md \
            docs/privacy-search-consent.md \
            docs/adl/ADR-001-search-consent.md \
            docs/devlog/README.md \
            LICENSE \
            README.md ; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required docs present."

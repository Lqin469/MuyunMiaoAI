name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug + lint + unit tests
        run: gradle :app:assembleDebug :app:lintDebug testDebugUnitTest --stacktrace

      - name: Docs presence check (R12)
        run: |
          for f in \
            docs/00-overview.md \
            docs/01-architecture.md \
            docs/03-contracts.md \
            docs/04-database.md \
            docs/05-model-hardware.md \
            docs/privacy-search-consent.md \
            docs/adl/ADR-001-search-consent.md \
            docs/devlog/README.md \
            LICENSE \
            README.md ; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "All required docs present."

  # 密钥扫描：任何 PR 若包含 API Key / 私钥等敏感信息，自动失败（AI 协作红线兜底）
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 拉全量历史，扫描所有提交

      - name: 下载并运行 gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar xzf gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose
          echo "gitleaks 扫描通过：未发现敏感信息。"


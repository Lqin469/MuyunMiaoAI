# ============================================================
# gradle.properties — Gradle 全局属性配置
# 作用：配置构建内存、AndroidX 开关、代码风格等全局项
# 注意：本文件必须提交（已在 .gitignore 中加白名单例外）
# 重要：不要在属性值行内写 # 注释（Gradle 会原样传给 java daemon 导致 # 被当 main class）
# ============================================================

# Gradle 进程 JVM 参数：4GB 堆内存 + UTF-8 编码（中文路径/注释必需）
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# 启用 AndroidX（Jetpack 新库体系，必须开启）
android.useAndroidX=true

# 每个模块只生成自己的 R 类，提升编译速度
android.nonTransitiveRClass=true

# 允许项目路径含非 ASCII 字符（本机项目目录含中文"ai备忘录"；Windows 上 AGP 默认会拒绝）
android.overridePathCheck=true

# Kotlin 官方代码风格检查
kotlin.code.style=official

# ============================================================
# gradle.properties — Gradle 全局属性配置
# 作用：配置构建内存、AndroidX 开关、代码风格等全局项
# 注意：本文件必须提交（已在 .gitignore 中加白名单例外）
# ============================================================

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8     # Gradle 进程 JVM 参数：4GB 堆内存 + UTF-8 编码（中文路径/注释必需）
android.useAndroidX=true                               # 启用 AndroidX（Jetpack 新库体系，必须开启）
android.nonTransitiveRClass=true                       # 每个模块只生成自己的 R 类，提升编译速度
kotlin.code.style=official                             # Kotlin 官方代码风格检查

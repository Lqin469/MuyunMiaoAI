# ============================================================
# gradle-wrapper.properties — Gradle Wrapper 版本定义
# 作用：固定团队使用的 Gradle 版本，保证任何人构建结果一致
# 注意：gradle-wrapper.jar（二进制）无法在本环境生成，首次用
#       Android Studio 同步或 `gradle wrapper --gradle-version 8.13` 生成
#       （详见 README「常见问题」）
# ============================================================

distributionBase=GRADLE_USER_HOME                       # 下载的 Gradle 解压根目录（用户主目录下的 .gradle）
distributionPath=wrapper/dists                          # 解压存放的相对子目录
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip  # Gradle 8.13 发行包下载地址（与 AGP 8.9 兼容）
networkTimeout=10000                                    # 下载超时时间（毫秒），网络差可调大
validateDistributionUrl=true                            # 下载前校验 URL 合法性
zipStoreBase=GRADLE_USER_HOME                           # zip 压缩包缓存根目录
zipStorePath=wrapper/dists                              # zip 压缩包缓存相对子目录
